name: Validate contributions
on:
  push:
    branches: [validation]
permissions:
  contents: read
jobs:
  ctan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: ["171", "173"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: sed -E 's/^(hard|soft|build) +//' DEPENDS.txt > .tl_packages
      - uses: zauguin/install-texlive@v4.5.0
        with:
          package_file: .tl_packages
          texlive_version: 2026
      - name: Reproduce the percent-path failure on the base
        if: matrix.ref == '171'
        run: |
          cp eolang.pl "$RUNNER_TEMP/candidate.pl"
          git fetch origin 8e060c53927d8187ac83e79938564dec4e51d30e --depth=1
          git show 8e060c53927d8187ac83e79938564dec4e51d30e:eolang.pl > eolang.pl
          if perl tests/percent-path-test.pl; then
            echo 'Expected the base to fail with a percent-containing path'
            exit 1
          fi
          cp "$RUNNER_TEMP/candidate.pl" eolang.pl
      - run: l3build ctan --show-log-on-error --halt-on-error
      - name: Run executable test entry points
        run: |
          for script in tests/*.pl; do
            "$script"
          done
